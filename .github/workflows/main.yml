name: Build CustomCompanions

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Add Stardew Valley reference assemblies
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-reference-assemblies@v1

      - name: Build
        run: dotnet build CustomCompanions/CustomCompanions.csproj -c Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: CustomCompanions
          path: CustomCompanions/bin/Release/**/*.dll
