
name: Build CustomCompanions

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Build
        run: dotnet build CustomCompanions/CustomCompanions.csproj -c Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: CustomCompanions
          path: CustomCompanions/bin/Release/**/*.dll
